name: Web CI

# Type-checks and builds the site on every change. Render deploys it (see render.yaml);
# this workflow only makes sure a broken build is caught on the pull request.
on:
  push:
    branches: [main]
    paths: ['web/**', 'render.yaml', '.github/workflows/web-ci.yml']
  pull_request:
    paths: ['web/**', 'render.yaml', '.github/workflows/web-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
